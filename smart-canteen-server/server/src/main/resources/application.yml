server:
  port: 8081

spring:
  # profiles:
  #   active: dev
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_canteen?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: "123456"
    type: com.alibaba.druid.pool.DruidDataSource

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: fun.cyhgraph.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    fun:
      cyhgraph:
        mapper: debug
        service: info
        controller: info

smartcanteen:
  jwt:
    admin-secret-key: cangqiongzhihuishitang
    admin-ttl: 7200000
    admin-token-name: Authorization
    user-secret-key: cangqiongzhihuishitang
    user-ttl: 7200000
    user-token-name: authentication

# 【核心修复】SpringDoc/Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: fun.cyhgraph.controller

# Knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
